[project]
name = "edtech-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.162.5",
    "google-genai>=3.3.0",
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[project.scripts]
edtech-rag-assistant = "edtech_rag_assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
